name: Build and Release Android APK

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.18.0'
        cache: 'yarn'
        
    - name: Enable Yarn
      run: corepack enable
        
    - name: Install Yarn dependencies
      run: yarn install --frozen-lockfile

    - name: Create environment files for CI
      run: |
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_DEV }}" > .env.dev
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_DEV }}" >> .env.dev
        echo "CRYPTO_JS_KEY=${{ secrets.CRYPTO_JS_KEY }}" >> .env.dev
        
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_PROD }}" > .env.prod
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_PROD }}" >> .env.prod
        echo "CRYPTO_JS_KEY=${{ secrets.CRYPTO_JS_KEY }}" >> .env.prod
        
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_UAT }}" > .env.uat
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_UAT }}" >> .env.uat
        echo "CRYPTO_JS_KEY=${{ secrets.CRYPTO_JS_KEY }}" >> .env.uat
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
       
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Cache Yarn dependencies
      uses: actions/cache@v3
      with:
        path: |
          node_modules
          ~/.cache/yarn
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-
          
    - name: Make gradlew executable
      run: chmod +x ./android/gradlew
      
    - name: Build UAT Release APK
      run: yarn android:uat-release-apk
      env:
        ENVFILE: .env.uat

    - name: Build Prod Release APK (draft)
      run: yarn android:prod-release-apk
      env:
        ENVFILE: .env.prod

    - name: Upload UAT APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-uat-release
        path: android/app/build/outputs/apk/uat/release/*.apk
        retention-days: 30
        
    - name: Upload Prod APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-prod-release
        path: android/app/build/outputs/apk/prod/release/*.apk
        retention-days: 30
        
    - name: Generate release tag
      id: tag
      run: |
        echo "RELEASE_TAG=v$(date +'%Y.%m.%d')-build-${{ github.run_number }}" >> $GITHUB_OUTPUT
        
    - name: Create Release with Latest Tag
      if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      id: create_release
      with:
        tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
        name: "Release ${{ steps.tag.outputs.RELEASE_TAG }}"
        body: |
          🚀 **Nouvelle version automatique** - **LATEST**
          
          **Changements:**
          - Build automatique depuis la branche develop
          - Commit: ${{ github.sha }}
          - Auteur: ${{ github.actor }}
          
          **Liens de téléchargement fixes:**
          - 📱 **[APK UAT(Test) Release (latest)](https://github.com/${{ github.repository }}/releases/latest/download/app-uat-release.apk)**
          
          **Installation:**
          1. Téléchargez l'APK correspondant via le lien ci-dessus
          2. Activez "Sources inconnues" sur votre appareil Android
          3. Installez l'APK
          
          ---
          *Build automatique généré le $(date +'%Y-%m-%d à %H:%M:%S')*
        files: |
          android/app/build/outputs/apk/uat/release/*.apk
        draft: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create Draft Release for Prod
      if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}-prod-draft
        name: "PROD Draft Release ${{ steps.tag.outputs.RELEASE_TAG }}"
        body: |
          🔒 **VERSION PRODUCTION - DRAFT**
          
          **Cette release est en mode brouillon et visible uniquement par les mainteneurs.**
          
          **Détails:**
          - Build automatique depuis la branche develop
          - Commit: ${{ github.sha }}
          - Auteur: ${{ github.actor }}
          - Environnement: Production
          
          **Pour publier:**
          1. Vérifier que tout fonctionne correctement
          2. Cliquer sur "Publish release"
          3. Supprimer le tag -prod-draft si nécessaire
          
          ---
          *Build automatique généré le $(date +'%Y-%m-%d à %H:%M:%S')*
        files: |
          android/app/build/outputs/apk/prod/release/*.apk
        draft: true
        prerelease: false
        make_latest: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Comment PR with APKs
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
          });
          
          const uatArtifact = artifacts.artifacts.find(artifact => artifact.name === 'app-uat-release');
          
          let comment = '🤖 **APKs construites avec succès !**\n\n';
          
          if (uatArtifact) {
            comment += '✅ **UAT Release APK** disponible dans les artifacts\n';
          }
          
          comment += `\n📥 [Télécharger les artifacts](${context.payload.pull_request.html_url}/checks)\n\n`;
          comment += '**Environnements de build:**\n';
          comment += '- 🧪 UAT: Configuration de test utilisateur\n';
          comment += '- 🔒 PROD: Version production (draft - visible uniquement par les mainteneurs)\n';
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });