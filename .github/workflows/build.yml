name: Build and Release Android APK

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: write
  packages: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.18.0'
        cache: 'yarn'
        
    - name: Enable Yarn
      run: corepack enable
        
    - name: Install Yarn dependencies
      run: yarn install --frozen-lockfile

    - name: Create environment files for CI
      run: |
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_DEV }}" > .env.dev
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_DEV }}" >> .env.dev
        echo "CRYPTO_JS_KEY=${{ secrets.CRYPTO_JS_KEY }}" >> .env.dev
        
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_PROD }}" > .env.prod
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_PROD }}" >> .env.prod
        echo "CRYPTO_JS_KEY=${{ secrets.CRYPTO_JS_KEY }}" >> .env.prod
        
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_UAT }}" > .env.uat
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_UAT }}" >> .env.uat
        echo "CRYPTO_JS_KEY=${{ secrets.CRYPTO_JS_KEY }}" >> .env.uat
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
       
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Cache Yarn dependencies
      uses: actions/cache@v3
      with:
        path: |
          node_modules
          ~/.cache/yarn
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-
          
    - name: Make gradlew executable
      run: chmod +x ./android/gradlew
      
    - name: Build Dev Debug APK
      if: github.event_name == 'push' # A SUPPRIMER PLUS TARD !!!!!
      run: yarn copy-env-dev && cd android && ./gradlew assembleDevDebug && cd .. && echo 'find APK in android/app/build/outputs/apk/dev/debug'
      env:
        ENVFILE: .env.dev
        
    - name: Build UAT Release APK
      if: github.event_name == 'push' # A SUPPRIMER PLUS TARD !!!!!
      run: yarn android:uat-release-apk
      env:
        ENVFILE: .env.uat

    - name: Build Production Release APK
      run: yarn android:prod-release-apk
      env:
        ENVFILE: .env.prod

    - name: Verify Production APK exists
      run: |
        if [ -f "android/app/build/outputs/apk/prod/release/app-prod-release.apk" ]; then
          echo "✅ Production APK found"
          ls -la android/app/build/outputs/apk/prod/release/
        else
          echo "❌ Production APK not found"
          echo "Available files:"
          find android/app/build/outputs/apk/ -name "*.apk" -type f
          exit 1
        fi

    # CORRECTION: Créer le fichier credentials depuis le secret
    - name: Create Google Drive credentials file
      run: |
        echo '${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}' > /tmp/google_credentials.json
        echo "Credentials file created"
        # Vérifier que le fichier est bien formé JSON
        if jq empty /tmp/google_credentials.json 2>/dev/null; then
          echo "✅ JSON credentials are valid"
        else
          echo "❌ Invalid JSON in credentials"
          exit 1
        fi

    # CORRECTION: Créer le fichier credentials depuis le secret
    - name: Create Google Drive credentials file
      run: |
        echo '${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}' > /tmp/google_credentials.json
        echo "Credentials file created"
        # Vérifier que le fichier est bien formé JSON
        if jq empty /tmp/google_credentials.json 2>/dev/null; then
          echo "✅ JSON credentials are valid"
        else
          echo "❌ Invalid JSON in credentials"
          exit 1
        fi

    # SOLUTION FIABLE: Script Python avec Google Drive API
    - name: Upload Production APK to Google Drive (OAuth)
      run: |
        pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client
        
        cat > upload_to_drive_oauth.py << 'EOF'
        import pickle
        import os
        from google.auth.transport.requests import Request
        from google_auth_oauthlib.flow import InstalledAppFlow
        from googleapiclient.discovery import build
        from googleapiclient.http import MediaFileUpload

        # Scope pour l'accès en lecture/écriture à Drive
        SCOPES = ['https://www.googleapis.com/auth/drive.file']

        def get_authenticated_service():
            creds = None
            token_file = '/tmp/token.pickle'
            
            # Charger les tokens existants
            if os.path.exists(token_file):
                with open(token_file, 'rb') as token:
                    creds = pickle.load(token)
            
            # Si pas de tokens valides, demander l'authentification
            if not creds or not creds.valid:
                if creds and creds.expired and creds.refresh_token:
                    creds.refresh(Request())
                else:
                    # Utiliser le fichier credentials créé précédemment
                    flow = InstalledAppFlow.from_client_secrets_file(
                        '/tmp/google_credentials.json', SCOPES)
                    creds = flow.run_local_server(port=0)
                
                # Sauvegarder les tokens pour la prochaine fois
                with open(token_file, 'wb') as token:
                    pickle.dump(creds, token)
            
            return build('drive', 'v3', credentials=creds)

        def upload_file():
            service = get_authenticated_service()
            file_path = 'android/app/build/outputs/apk/prod/release/app-prod-release.apk'
            file_name = f'notemd-prod-v{os.environ.get("GITHUB_RUN_NUMBER", "unknown")}.apk'
            folder_id = os.environ.get('FOLDER_ID')
            
            file_metadata = {
                'name': file_name,
                'parents': [folder_id] if folder_id else []
            }
            
            media = MediaFileUpload(file_path, resumable=True)
            
            file = service.files().create(
                body=file_metadata,
                media_body=media,
                fields='id,name,webViewLink'
            ).execute()
            
            print(f"✅ Fichier uploadé avec succès!")
            print(f"   Nom: {file.get('name')}")
            print(f"   Lien: {file.get('webViewLink')}")

        if __name__ == '__main__':
            upload_file()
        EOF
            
            python upload_to_drive_oauth.py
          env:
            FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
            GITHUB_RUN_NUMBER: ${{ github.run_number }}
        
    - name: Upload UAT APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-uat-release
        path: android/app/build/outputs/apk/uat/release/*.apk
        retention-days: 30
        
    - name: Upload Dev APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-dev-debug
        path: android/app/build/outputs/apk/dev/debug/*.apk
        retention-days: 30
        
    - name: Generate release tag
      id: tag
      run: |
        echo "RELEASE_TAG=v$(date +'%Y.%m.%d')-build-${{ github.run_number }}" >> $GITHUB_OUTPUT
        
    - name: Create Release with Latest Tag
      if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      id: create_release
      with:
        tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
        name: "Release ${{ steps.tag.outputs.RELEASE_TAG }}"
        body: |
          🚀 **Nouvelle version automatique** - **LATEST**
          
          **Changements:**
          - Build automatique depuis la branche develop
          - Commit: ${{ github.sha }}
          - Auteur: ${{ github.actor }}
          
          **Liens de téléchargement:**
          - 📱 **[APK UAT (Test) Release](https://github.com/${{ github.repository }}/releases/latest/download/app-uat-release.apk)**
          - 🔧 **[APK Dev Debug](https://github.com/${{ github.repository }}/releases/latest/download/app-dev-debug.apk)**
          - 🚀 **APK Production**: Disponible sur Google Drive
          
          **Installation:**
          1. Téléchargez l'APK correspondant via le lien ci-dessus
          2. Activez "Sources inconnues" sur votre appareil Android
          3. Installez l'APK
          
          ---
          *Build automatique généré le $(date +'%Y-%m-%d à %H:%M:%S')*
        files: |
          android/app/build/outputs/apk/uat/release/*.apk
          android/app/build/outputs/apk/dev/debug/*.apk
        draft: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Comment PR with APKs
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
          });
          
          const uatArtifact = artifacts.artifacts.find(artifact => artifact.name === 'app-uat-release');
          const devArtifact = artifacts.artifacts.find(artifact => artifact.name === 'app-dev-debug');
          
          let comment = '🤖 **APKs construites avec succès !**\n\n';
          
          if (uatArtifact) {
            comment += '✅ **UAT Release APK** disponible dans les artifacts\n';
          }
          if (devArtifact) {
            comment += '✅ **Dev Debug APK** disponible dans les artifacts\n';
          }
          
          comment += `\n📥 [Télécharger les artifacts](${context.payload.pull_request.html_url}/checks)\n\n`;
          comment += '**Environnements de build:**\n';
          comment += '- 🧪 UAT: Configuration de test utilisateur\n';
          comment += '- 🔧 Dev: Version de développement avec logs détaillés\n';
          comment += '- 🚀 Production: Version finale (uploadée sur Google Drive)';
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    # Nettoyage des fichiers sensibles
    - name: Cleanup sensitive files
      if: always()
      run: |
        rm -f /tmp/google_credentials.json
        rm -f .env.*