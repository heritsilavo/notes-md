name: Build and Release Android APK

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: write
  packages: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.18.0'
        cache: 'yarn'
        
    - name: Enable Yarn
      run: corepack enable
        
    - name: Install Yarn dependencies
      run: yarn install --frozen-lockfile

    - name: Create environment files for CI
      run: |
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_DEV }}" > .env.dev
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_DEV }}" >> .env.dev
        echo "CRYPTO_JS_KEY=${{ secrets.CRYPTO_JS_KEY }}" >> .env.dev
        
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_PROD }}" > .env.prod
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_PROD }}" >> .env.prod
        echo "CRYPTO_JS_KEY=${{ secrets.CRYPTO_JS_KEY }}" >> .env.prod
        
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_UAT }}" > .env.uat
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_UAT }}" >> .env.uat
        echo "CRYPTO_JS_KEY=${{ secrets.CRYPTO_JS_KEY }}" >> .env.uat
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
       
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Cache Yarn dependencies
      uses: actions/cache@v3
      with:
        path: |
          node_modules
          ~/.cache/yarn
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-
          
    - name: Make gradlew executable
      run: chmod +x ./android/gradlew
      
    - name: Build Dev Debug APK
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop' # A SUPPRIMER PLUS TARD !!!!!
      run: yarn copy-env-dev && cd android && ./gradlew assembleDevDebug && cd .. && echo 'find APK in android/app/build/outputs/apk/dev/debug'
      env:
        ENVFILE: .env.dev
        
    - name: Build UAT Release APK
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop' # A SUPPRIMER PLUS TARD !!!!!
      run: yarn android:uat-release-apk
      env:
        ENVFILE: .env.uat

    - name: Build Production Release APK
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      run: yarn android:prod-release-apk
      env:
        ENVFILE: .env.prod

    ## create dummy android/app/build/outputs/apk/prod/release/app-prod-release.apk just to test google drive upload
    - name: Create dummy Production APK for testing
      run: |
        mkdir -p android/app/build/outputs/apk/prod/release
        echo "This is a dummy APK file for testing purposes." > android/app/build/outputs/apk/prod/release/app-prod-release.apk

    - name: Verify Production APK exists
      run: |
        if [ -f "android/app/build/outputs/apk/prod/release/app-prod-release.apk" ]; then
          echo "✅ Production APK found"
          ls -la android/app/build/outputs/apk/prod/release/
        else
          echo "❌ Production APK not found"
          echo "Available files:"
          find android/app/build/outputs/apk/ -name "*.apk" -type f
          exit 1
        fi

    # SOLUTION: Upload vers Google Drive avec Service Account
    # Alternative plus simple - Upload via requêtes HTTP directes
    - name: Upload Production APK to Google Drive (HTTP Method)
      run: |
        # Installation des dépendances minimales
        pip install requests google-auth cryptography
        
        # Script d'upload simplifié avec requêtes HTTP
        cat > upload_to_drive_simple.py << 'EOF'
        import json
        import os
        import requests
        import time
        from google.oauth2 import service_account
        import google.auth.transport.requests

        def get_access_token():
            """Obtenir un token d'accès avec le service account"""
            try:
                # Chargement des credentials
                credentials_json = os.environ.get('GOOGLE_DRIVE_CREDENTIALS')
                if not credentials_json:
                    raise ValueError("GOOGLE_DRIVE_CREDENTIALS not found")
                
                credentials_info = json.loads(credentials_json)
                
                # Création des credentials
                SCOPES = ['https://www.googleapis.com/auth/drive.file']
                credentials = service_account.Credentials.from_service_account_info(
                    credentials_info, scopes=SCOPES
                )
                
                # Refresh du token
                request = google.auth.transport.requests.Request()
                credentials.refresh(request)
                
                return credentials.token
                
            except Exception as e:
                print(f"❌ Error getting access token: {e}")
                return None

        def upload_file():
            """Upload du fichier vers Google Drive"""
            try:
                # Obtention du token
                access_token = get_access_token()
                if not access_token:
                    return False
                
                # Paramètres
                file_path = 'android/app/build/outputs/apk/prod/release/app-prod-release.apk'
                file_name = f'notemd-prod-v{os.environ.get("GITHUB_RUN_NUMBER", "unknown")}.apk'
                folder_id = os.environ.get('GOOGLE_DRIVE_FOLDER_ID')
                
                # Vérification du fichier
                if not os.path.exists(file_path):
                    print(f"❌ File not found: {file_path}")
                    return False
                
                file_size = os.path.getsize(file_path)
                print(f"📤 Uploading {file_name}")
                print(f"   File size: {file_size} bytes")
                
                # Métadonnées
                metadata = {
                    'name': file_name,
                }
                if folder_id:
                    metadata['parents'] = [folder_id]
                
                # Headers pour l'upload
                headers = {
                    'Authorization': f'Bearer {access_token}',
                    'Content-Type': 'application/octet-stream',
                }
                
                # URL d'upload simple
                url = 'https://www.googleapis.com/upload/drive/v3/files'
                params = {
                    'uploadType': 'multipart',
                }
                
                # Préparation du multipart
                files = {
                    'metadata': (None, json.dumps(metadata), 'application/json'),
                    'file': (file_name, open(file_path, 'rb'), 'application/octet-stream')
                }
                
                # Upload
                print("   Uploading...")
                response = requests.post(url, headers={'Authorization': f'Bearer {access_token}'}, files=files, params=params)
                
                # Fermeture du fichier
                files['file'][1].close()
                
                if response.status_code == 200:
                    result = response.json()
                    print(f"✅ Upload successful!")
                    print(f"   File ID: {result.get('id')}")
                    print(f"   File name: {result.get('name')}")
                    
                    # Partage du fichier
                    file_id = result.get('id')
                    if file_id:
                        share_url = f'https://www.googleapis.com/drive/v3/files/{file_id}/permissions'
                        share_data = {
                            'role': 'reader',
                            'type': 'anyone'
                        }
                        share_response = requests.post(
                            share_url, 
                            headers={'Authorization': f'Bearer {access_token}', 'Content-Type': 'application/json'},
                            data=json.dumps(share_data)
                        )
                        
                        if share_response.status_code == 200:
                            print(f"   ✅ File shared publicly")
                            print(f"   🔗 View link: https://drive.google.com/file/d/{file_id}/view")
                        else:
                            print(f"   ⚠️  Could not share file: {share_response.status_code}")
                    
                    return True
                else:
                    print(f"❌ Upload failed: {response.status_code}")
                    print(f"   Response: {response.text}")
                    return False
                    
            except Exception as e:
                print(f"❌ Upload error: {e}")
                return False

        if __name__ == '__main__':
            success = upload_file()
            exit(0 if success else 1)
        EOF
        
        # Exécution du script
        python upload_to_drive_simple.py
      env:
        GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        GITHUB_RUN_NUMBER: ${{ github.run_number }}        
    - name: Upload UAT APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-uat-release
        path: android/app/build/outputs/apk/uat/release/*.apk
        retention-days: 30
        
    - name: Upload Dev APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-dev-debug
        path: android/app/build/outputs/apk/dev/debug/*.apk
        retention-days: 30
        
    - name: Generate release tag
      id: tag
      run: |
        echo "RELEASE_TAG=v$(date +'%Y.%m.%d')-build-${{ github.run_number }}" >> $GITHUB_OUTPUT
        
    - name: Create Release with Latest Tag
      if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      id: create_release
      with:
        tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
        name: "Release ${{ steps.tag.outputs.RELEASE_TAG }}"
        body: |
          🚀 **Nouvelle version automatique** - **LATEST**
          
          **Changements:**
          - Build automatique depuis la branche develop
          - Commit: ${{ github.sha }}
          - Auteur: ${{ github.actor }}
          
          **Liens de téléchargement:**
          - 📱 **[APK UAT (Test) Release](https://github.com/${{ github.repository }}/releases/latest/download/app-uat-release.apk)**
          - 🔧 **[APK Dev Debug](https://github.com/${{ github.repository }}/releases/latest/download/app-dev-debug.apk)**
          - 🚀 **APK Production**: Disponible sur Google Drive
          
          **Installation:**
          1. Téléchargez l'APK correspondant via le lien ci-dessus
          2. Activez "Sources inconnues" sur votre appareil Android
          3. Installez l'APK
          
          ---
          *Build automatique généré le $(date +'%Y-%m-%d à %H:%M:%S')*
        files: |
          android/app/build/outputs/apk/uat/release/*.apk
          android/app/build/outputs/apk/dev/debug/*.apk
        draft: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Comment PR with APKs
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
          });
          
          const uatArtifact = artifacts.artifacts.find(artifact => artifact.name === 'app-uat-release');
          const devArtifact = artifacts.artifacts.find(artifact => artifact.name === 'app-dev-debug');
          
          let comment = '🤖 **APKs construites avec succès !**\n\n';
          
          if (uatArtifact) {
            comment += '✅ **UAT Release APK** disponible dans les artifacts\n';
          }
          if (devArtifact) {
            comment += '✅ **Dev Debug APK** disponible dans les artifacts\n';
          }
          
          comment += `\n📥 [Télécharger les artifacts](${context.payload.pull_request.html_url}/checks)\n\n`;
          comment += '**Environnements de build:**\n';
          comment += '- 🧪 UAT: Configuration de test utilisateur\n';
          comment += '- 🔧 Dev: Version de développement avec logs détaillés\n';
          comment += '- 🚀 Production: Version finale (uploadée sur Google Drive)';
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    # Nettoyage des fichiers sensibles
    - name: Cleanup sensitive files
      if: always()
      run: |
        rm -f .env.*
        rm -f upload_to_drive.py