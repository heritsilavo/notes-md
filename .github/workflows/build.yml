name: Build and Release Android APK

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: write
  packages: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.18.0'
        cache: 'yarn'
        
    - name: Enable Yarn
      run: corepack enable
        
    - name: Install Yarn dependencies
      run: yarn install --frozen-lockfile

    - name: Create environment files for CI
      run: |
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_DEV }}" > .env.dev
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_DEV }}" >> .env.dev
        echo "CRYPTO_JS_KEY=${{ secrets.CRYPTO_JS_KEY }}" >> .env.dev
        
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_PROD }}" > .env.prod
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_PROD }}" >> .env.prod
        echo "CRYPTO_JS_KEY=${{ secrets.CRYPTO_JS_KEY }}" >> .env.prod
        
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_UAT }}" > .env.uat
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_UAT }}" >> .env.uat
        echo "CRYPTO_JS_KEY=${{ secrets.CRYPTO_JS_KEY }}" >> .env.uat
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
       
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Cache Yarn dependencies
      uses: actions/cache@v3
      with:
        path: |
          node_modules
          ~/.cache/yarn
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-
          
    - name: Make gradlew executable
      run: chmod +x ./android/gradlew
      
    - name: Build Dev Debug APK
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop' # A SUPPRIMER PLUS TARD !!!!!
      run: yarn copy-env-dev && cd android && ./gradlew assembleDevDebug && cd .. && echo 'find APK in android/app/build/outputs/apk/dev/debug'
      env:
        ENVFILE: .env.dev
        
    - name: Build UAT Release APK
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop' # A SUPPRIMER PLUS TARD !!!!!
      run: yarn android:uat-release-apk
      env:
        ENVFILE: .env.uat

    - name: Build Production Release APK
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      run: yarn android:prod-release-apk
      env:
        ENVFILE: .env.prod

    ## create dummy android/app/build/outputs/apk/prod/release/app-prod-release.apk just to test google drive upload
    - name: Create dummy Production APK for testing
      run: |
        mkdir -p android/app/build/outputs/apk/prod/release
        echo "This is a dummy APK file for testing purposes." > android/app/build/outputs/apk/prod/release/app-prod-release.apk

    - name: Verify Production APK exists
      run: |
        if [ -f "android/app/build/outputs/apk/prod/release/app-prod-release.apk" ]; then
          echo "✅ Production APK found"
          ls -la android/app/build/outputs/apk/prod/release/
        else
          echo "❌ Production APK not found"
          echo "Available files:"
          find android/app/build/outputs/apk/ -name "*.apk" -type f
          exit 1
        fi

    # SOLUTION: Upload vers Google Drive avec Service Account
    - name: Upload Production APK to Google Drive
      run: |
        # Installation des dépendances Python
        pip install google-auth google-auth-httplib2 google-api-python-client
        
        # Création du script d'upload avec Service Account
        cat > upload_to_drive.py << 'EOF'
        import json
        import os
        from google.auth import service_account
        from googleapiclient.discovery import build
        from googleapiclient.http import MediaFileUpload
        from googleapiclient.errors import HttpError

        def upload_file_to_drive():
            try:
                # Chargement des credentials du service account
                credentials_json = os.environ.get('GOOGLE_SERVICE_ACCOUNT_KEY')
                if not credentials_json:
                    raise ValueError("GOOGLE_SERVICE_ACCOUNT_KEY environment variable not found")
                
                # Parse des credentials JSON
                credentials_info = json.loads(credentials_json)
                
                # Création des credentials avec les scopes nécessaires
                SCOPES = ['https://www.googleapis.com/auth/drive.file']
                credentials = service_account.Credentials.from_service_account_info(
                    credentials_info, scopes=SCOPES
                )
                
                # Création du service Google Drive
                service = build('drive', 'v3', credentials=credentials)
                
                # Paramètres du fichier à uploader
                file_path = 'android/app/build/outputs/apk/prod/release/app-prod-release.apk'
                file_name = f'notemd-prod-v{os.environ.get("GITHUB_RUN_NUMBER", "unknown")}.apk'
                folder_id = os.environ.get('GOOGLE_DRIVE_FOLDER_ID')
                
                # Vérification de l'existence du fichier
                if not os.path.exists(file_path):
                    raise FileNotFoundError(f"APK file not found: {file_path}")
                
                print(f"📤 Uploading {file_name} to Google Drive...")
                print(f"   File size: {os.path.getsize(file_path)} bytes")
                
                # Métadonnées du fichier
                file_metadata = {
                    'name': file_name,
                }
                
                # Si un dossier parent est spécifié
                if folder_id:
                    file_metadata['parents'] = [folder_id]
                    print(f"   Parent folder ID: {folder_id}")
                
                # Upload du fichier
                media = MediaFileUpload(
                    file_path, 
                    resumable=True,
                    chunksize=1024*1024  # 1MB chunks
                )
                
                request = service.files().create(
                    body=file_metadata,
                    media_body=media,
                    fields='id,name,webViewLink,size'
                )
                
                file = None
                while file is None:
                    status, file = request.next_chunk()
                    if status:
                        print(f"   Upload progress: {int(status.progress() * 100)}%")
                
                print(f"✅ Upload successful!")
                print(f"   File ID: {file.get('id')}")
                print(f"   File name: {file.get('name')}")
                print(f"   View link: {file.get('webViewLink')}")
                print(f"   File size: {file.get('size')} bytes")
                
                # Partage du fichier (optionnel - rendre accessible avec le lien)
                try:
                    service.permissions().create(
                        fileId=file.get('id'),
                        body={
                            'role': 'reader',
                            'type': 'anyone'
                        }
                    ).execute()
                    print("   ✅ File shared publicly (anyone with link can view)")
                except HttpError as e:
                    print(f"   ⚠️  Could not share file publicly: {e}")
                
                return True
                
            except json.JSONDecodeError as e:
                print(f"❌ Invalid JSON in service account credentials: {e}")
                return False
            except FileNotFoundError as e:
                print(f"❌ File error: {e}")
                return False
            except HttpError as e:
                print(f"❌ Google Drive API error: {e}")
                return False
            except Exception as e:
                print(f"❌ Unexpected error: {e}")
                return False

        if __name__ == '__main__':
            success = upload_file_to_drive()
            exit(0 if success else 1)
        EOF
        
        # Exécution du script d'upload
        python upload_to_drive.py
      env:
        GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        GITHUB_RUN_NUMBER: ${{ github.run_number }}
        
    - name: Upload UAT APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-uat-release
        path: android/app/build/outputs/apk/uat/release/*.apk
        retention-days: 30
        
    - name: Upload Dev APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-dev-debug
        path: android/app/build/outputs/apk/dev/debug/*.apk
        retention-days: 30
        
    - name: Generate release tag
      id: tag
      run: |
        echo "RELEASE_TAG=v$(date +'%Y.%m.%d')-build-${{ github.run_number }}" >> $GITHUB_OUTPUT
        
    - name: Create Release with Latest Tag
      if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      id: create_release
      with:
        tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
        name: "Release ${{ steps.tag.outputs.RELEASE_TAG }}"
        body: |
          🚀 **Nouvelle version automatique** - **LATEST**
          
          **Changements:**
          - Build automatique depuis la branche develop
          - Commit: ${{ github.sha }}
          - Auteur: ${{ github.actor }}
          
          **Liens de téléchargement:**
          - 📱 **[APK UAT (Test) Release](https://github.com/${{ github.repository }}/releases/latest/download/app-uat-release.apk)**
          - 🔧 **[APK Dev Debug](https://github.com/${{ github.repository }}/releases/latest/download/app-dev-debug.apk)**
          - 🚀 **APK Production**: Disponible sur Google Drive
          
          **Installation:**
          1. Téléchargez l'APK correspondant via le lien ci-dessus
          2. Activez "Sources inconnues" sur votre appareil Android
          3. Installez l'APK
          
          ---
          *Build automatique généré le $(date +'%Y-%m-%d à %H:%M:%S')*
        files: |
          android/app/build/outputs/apk/uat/release/*.apk
          android/app/build/outputs/apk/dev/debug/*.apk
        draft: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Comment PR with APKs
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
          });
          
          const uatArtifact = artifacts.artifacts.find(artifact => artifact.name === 'app-uat-release');
          const devArtifact = artifacts.artifacts.find(artifact => artifact.name === 'app-dev-debug');
          
          let comment = '🤖 **APKs construites avec succès !**\n\n';
          
          if (uatArtifact) {
            comment += '✅ **UAT Release APK** disponible dans les artifacts\n';
          }
          if (devArtifact) {
            comment += '✅ **Dev Debug APK** disponible dans les artifacts\n';
          }
          
          comment += `\n📥 [Télécharger les artifacts](${context.payload.pull_request.html_url}/checks)\n\n`;
          comment += '**Environnements de build:**\n';
          comment += '- 🧪 UAT: Configuration de test utilisateur\n';
          comment += '- 🔧 Dev: Version de développement avec logs détaillés\n';
          comment += '- 🚀 Production: Version finale (uploadée sur Google Drive)';
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    # Nettoyage des fichiers sensibles
    - name: Cleanup sensitive files
      if: always()
      run: |
        rm -f .env.*
        rm -f upload_to_drive.py