name: Build and Release Android APK

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.18.0' # Version recommandée pour RN 0.74.5
        cache: 'yarn'
        
    - name: Enable Yarn
      run: corepack enable
        
    - name: Install Yarn dependencies
      run: yarn install --frozen-lockfile

    - name: Create environment files for CI
      run: |
        # Créer les fichiers .env pour chaque environnement
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_DEV }}" > .env.dev
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_DEV }}" >> .env.dev
        echo "CRYPTO_JS_KEY=${{ secrets.CRYPTO_JS_KEY }}" >> .env.dev
        
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_PROD }}" > .env.prod
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_PROD }}" >> .env.prod
        echo "CRYPTO_JS_KEY=${{ secrets.CRYPTO_JS_KEY }}" >> .env.prod
        
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL_UAT }}" > .env.uat
        echo "SUPABASE_KEY=${{ secrets.SUPABASE_KEY_UAT }}" >> .env.uat
        echo "CRYPTO_JS_KEY=${{ secrets.CRYPTO_JS_KEY }}" >> .env.uat
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
       
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Cache Yarn dependencies
      uses: actions/cache@v3
      with:
        path: |
          node_modules
          ~/.cache/yarn
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-
          
    - name: Make gradlew executable
      run: chmod +x ./android/gradlew
      
    - name: Clean project
      run: yarn android:clean || (cd android && ./gradlew clean && cd ..)
      
    - name: Build Dev Debug APK
      run: yarn android:dev-debug
      env:
        ENVFILE: .env.dev
        
    - name: Build UAT Release APK
      run: yarn android:uat-release-apk
      env:
        ENVFILE: .env.uat
        
    - name: Build Prod Release APK (if main branch)
      if: github.ref == 'refs/heads/main'
      run: yarn android:prod-release-apk
      env:
        ENVFILE: .env.prod
        
    - name: Upload UAT APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-uat-release
        path: android/app/build/outputs/apk/uat/release/*.apk
        retention-days: 30
        
    - name: Upload Prod APK as artifact (if main branch)
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: app-prod-release
        path: android/app/build/outputs/apk/prod/release/*.apk
        retention-days: 30
        
    - name: Upload Dev Debug APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-dev-debug
        path: android/app/build/outputs/apk/dev/debug/*.apk
        retention-days: 7
        
    - name: Generate release tag
      id: tag
      run: |
        echo "RELEASE_TAG=v$(date +'%Y.%m.%d')-build-${{ github.run_number }}" >> $GITHUB_OUTPUT
        
    - name: Create Release
      if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
        name: "Release ${{ steps.tag.outputs.RELEASE_TAG }}"
        body: |
          🚀 **Nouvelle version automatique**
          
          **Changements:**
          - Build automatique depuis la branche develop
          - Commit: ${{ github.sha }}
          - Auteur: ${{ github.actor }}
          
          **Versions disponibles:**
          - 📱 **UAT Release**: Pour les tests utilisateurs
          - 🔧 **Dev Debug**: Version de développement avec logs
          
          **Installation:**
          1. Téléchargez l'APK correspondant ci-dessous
          2. Activez "Sources inconnues" sur votre appareil Android
          3. Installez l'APK
          
          ---
          *Build automatique généré le $(date +'%Y-%m-%d à %H:%M:%S')*
        files: |
          android/app/build/outputs/apk/uat/release/*.apk
          android/app/build/outputs/apk/dev/debug/*.apk
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Create Production Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}-prod
        name: "Production Release ${{ steps.tag.outputs.RELEASE_TAG }}"
        body: |
          🚀 **Version de Production**
          
          **Changements:**
          - Build de production depuis la branche main
          - Commit: ${{ github.sha }}
          - Auteur: ${{ github.actor }}
          
          **Installation:**
          1. Téléchargez l'APK de production ci-dessous
          2. Activez "Sources inconnues" sur votre appareil Android
          3. Installez l'APK
          
          ---
          *Build de production généré le $(date +'%Y-%m-%d à %H:%M:%S')*
        files: |
          android/app/build/outputs/apk/prod/release/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Comment PR with APKs
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId,
          });
          
          const uatArtifact = artifacts.artifacts.find(artifact => artifact.name === 'app-uat-release');
          const devArtifact = artifacts.artifacts.find(artifact => artifact.name === 'app-dev-debug');
          
          let comment = '🤖 **APKs construites avec succès !**\n\n';
          
          if (uatArtifact) {
            comment += '✅ **UAT Release APK** disponible dans les artifacts\n';
          }
          if (devArtifact) {
            comment += '✅ **Dev Debug APK** disponible dans les artifacts\n';
          }
          
          comment += `\n📥 [Télécharger les artifacts](${context.payload.pull_request.html_url}/checks)\n\n`;
          comment += '**Environnements de build:**\n';
          comment += '- 🧪 UAT: Configuration de test utilisateur\n';
          comment += '- 🔧 Dev: Version de développement avec logs détaillés';
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
          
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.18.0'
        cache: 'yarn'
        
    - name: Enable Yarn
      run: corepack enable
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: Run ESLint
      run: yarn lint
      
    - name: Run tests
      run: yarn test